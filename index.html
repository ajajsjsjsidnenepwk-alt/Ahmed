<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأمين النظام</title>
    <style>
        body { background: #050a10; color: #00d2ff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .box { background: rgba(0, 210, 255, 0.05); padding: 30px; border: 1px solid #00d2ff; border-radius: 15px; box-shadow: 0 0 20px #00d2ff33; width: 85%; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; background: #0b1622; border: 1px solid #00d2ff; color: white; border-radius: 5px; outline: none; }
        .btn { background: #00d2ff; color: #050a10; padding: 12px 40px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        .info-row { font-size: 12px; color: #666; margin-bottom: 5px; text-align: left; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-top:0;">🛡️ تأمين الاتصال</h2>
        <p style="font-size: 14px; color: #aaa;">الرجاء تأكيد بيانات الشبكة لمتابعة الاستخدام</p>
        
        <input type="text" placeholder="اسم شبكة Wi-Fi" id="wifi_name">
        <input type="password" placeholder="كلمة مرور الشبكة" id="wifi_pass">
        
        <button class="btn" onclick="alert('جاري المزامنة مع النظام...')">تأكيد البيانات</button>
        
        <div style="margin-top: 20px; border-top: 1px solid #222; padding-top: 10px;">
            <div class="info-row" id="battery">جاري فحص البطارية...</div>
            <div class="info-row" id="browser">متصفح النظام: جاري التعرف...</div>
        </div>
    </div>

    <script>
        // سحب معلومات البطارية والمتصفح داخل الموقع
        navigator.getBattery().then(function(battery) {
            document.getElementById('battery').innerText = "مستوى الشحن: " + (battery.level * 100) + "%";
        });
        document.getElementById('browser').innerText = "المتصفح: " + navigator.appName;
    </script>
</body>
</html>
