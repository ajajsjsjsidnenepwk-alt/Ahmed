<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة أحمد الاحترافية</title>
    <style>
        /* تصميم الخلفية المتحركة */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            text-align: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 80%;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { font-size: 1.1rem; opacity: 0.8; }

        /* تصميم الأزرار */
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #00d2ff;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }

        .btn:hover { transform: scale(1.05); background: #3a7bd5; }
    </style>
</head>
<body>

<div class="container">
    <h1>أهلاً بك في تطبيق أحمد</h1>
    <p>هذا الموقع يعمل الآن داخل التطبيق الخاص بي بنجاح!</p>
    <a href="https://t.me/your_telegram_username" class="btn">تواصل معي على تلجرام</a>
</div>

</body>
</html>
